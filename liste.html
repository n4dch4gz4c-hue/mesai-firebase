function doLogout(){
  sessionStorage.removeItem("mesaiUser");
  currentUser = null;
  document.getElementById("loginOverlay").style.display = "flex";
  document.getElementById("loginPass").value = "";
  document.getElementById("loginError").style.display = "none";
}

function doLogin(){
  const p = (document.getElementById("loginPass").value||"").trim();
  const u = USERS.find(x => x.pass === p);
  if(!u){
    document.getElementById("loginError").style.display = "block";
    return;
  }
  currentUser = u;
  sessionStorage.setItem("mesaiUser", JSON.stringify(u));
  document.getElementById("loginOverlay").style.display = "none";
  applyUserAccess();
  setTimeout(load, 100);
}

function applyUserAccess(){
  if(!currentUser) return;
  const nameEl = document.getElementById("userName");
  if(nameEl) nameEl.textContent = currentUser.name;
  const sel = document.getElementById("branch");
  if(sel){
    Array.from(sel.options).forEach(opt => {
      opt.disabled = !currentUser.branches.includes(opt.value);
      opt.style.display = currentUser.branches.includes(opt.value) ? "" : "none";
    });
    const first = currentUser.branches[0];
    if(first){ sel.value = first; branch = first; }
  }
  const dashBtn = document.querySelector('button.tab[onclick*="dashboard"], .tab[onclick*="dashboard"]');
  if(dashBtn) dashBtn.style.display = currentUser.admin ? "" : "none";
}

// Auto login if session exists
(function(){
  try{
    const saved = sessionStorage.getItem("mesaiUser");
    if(saved){
      currentUser = JSON.parse(saved);
      document.getElementById("loginOverlay").style.display = "none";
      applyUserAccess();
    }
  }catch(e){}
})();

: 0, "izinTutar": 0, "yillikTutar": 0, "disiplinDk": 0}]};

const PRIM_BIRIM = 7;
let branch = "Cadde";
let state = { people: [], cezalar: [], devamsizlik: [] };


function showTab(name, btn){
  document.querySelectorAll('[id^="sec-"]').forEach(el=>el.style.display="none");
  document.getElementById("sec-"+name).style.display = name==="liste" ? "block" : "block";
  if(name==="liste") document.getElementById("sec-liste").style.display="block";
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  if(btn) btn.classList.add("on");
  if(name==="devam") renderDevam();
  if(name==="ceza") renderCeza();
  if(name==="ozet") renderOzet();
  if(name==="dashboard") renderDashboard();
}

function toast(m){
  const t=document.getElementById("toast");
  if(!t) return;
  t.textContent=m; t.style.display="block";
  setTimeout(()=>t.style.display="none",1800);
}
function tl(n){ return Math.round(n||0).toLocaleString("tr-TR"); }
function dash(n){ return (Math.round(n)||0)===0 ? "-" : tl(n); }

function calc(p){
  const mesai = (p.mesaiSaat||0) * (p.mesaiBirim||300);
  const hs = (p.hsSaat||0) * 2500;
  const prim = (branch==="Cadde" && p.kurye) ? (p.primAdet||0)*PRIM_BIRIM : 0;
  const yol = p.yolTutar||0;
  const izin = p.izinTutar||0;
  const yillik = p.yillikTutar||0;
  const dis = (p.disiplinDk||0);
  return {mesai, hs, prim, yol, izin, yillik, dis, toplam: mesai+hs+prim+yol+izin+yillik+dis};
}

function render(){
  const tb = document.getElementById("tbody");
  if(!tb) return;
  tb.innerHTML = "";
  let sMesai=0, sHs=0, sPrim=0, sYol=0, sTop=0;
  (state.people||[]).forEach((p,i)=>{
    const c = calc(p);
    sMesai+=c.mesai; sHs+=c.hs; sPrim+=c.prim; sYol+=c.yol; sTop+=c.toplam;
    const k = (branch==="Cadde" && p.kurye) ? ' <b style="color:#c45c26">K</b>' : '';
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="name">${p.name||""}${k}</td>
      <td><input class="cell" type="number" step="0.5" value="${p.mesaiSaat||0}" onchange="setP(${i},'mesaiSaat',this.value)"></td>
      <td class="formula">${dash(c.mesai)}</td>
      <td><input class="cell" type="number" step="0.5" value="${p.hsSaat||0}" onchange="setP(${i},'hsSaat',this.value)"></td>
      <td class="formula">${dash(c.hs)}</td>
      <td>${branch==="Cadde" && p.kurye ? `<input class="cell" type="number" value="${p.primAdet||0}" onchange="setP(${i},'primAdet',this.value)" style="width:50px">` : "-"}</td>
      <td class="formula">${dash(c.prim)}</td>
      <td><input class="cell" type="number" value="${p.yolTutar||0}" onchange="setP(${i},'yolTutar',this.value)"></td>
      <td><input class="cell" type="number" value="${p.izinTutar||0}" onchange="setP(${i},'izinTutar',this.value)"></td>
      <td><input class="cell" type="number" value="${p.yillikTutar||0}" onchange="setP(${i},'yillikTutar',this.value)"></td>
      <td><input class="cell" type="number" value="${p.disiplinDk||0}" onchange="setP(${i},'disiplinDk',this.value)"></td>
      <td class="formula">${dash(c.toplam)}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById("stats").innerHTML = `
    <div class="stat">Kişi<b>${state.people.length}</b></div>
    <div class="stat">Mesai<b>${tl(sMesai)}</b></div>
    <div class="stat">HS<b>${tl(sHs)}</b></div>
    <div class="stat">Prim<b>${tl(sPrim)}</b></div>
    <div class="stat">Yol<b>${tl(sYol)}</b></div>
    <div class="stat">Toplam<b>${tl(sTop)} TL</b></div>`;
  renderOzet();
  renderDevam();
  renderCeza();
}

function setP(i,k,v){
  if(!state.people[i]) return;
  state.people[i][k] = +v || 0;
  render();
}

function saveNow(){
  db.ref("mesai/"+branch).set(state).then(()=>toast("Kaydedildi – herkes görür")).catch(e=>toast("Hata: "+e.message));
}

function switchBranch(){
  branch = document.getElementById("branch").value;
  load();
}


async function renderDashboard(){
  const el = document.getElementById("sec-dashboard");
  if(!el) return;
  el.innerHTML = "<div style='padding:16px;'>Yükleniyor...</div>";

  const branches = ["Cadde","Kadıköy","Çengelköy"];
  const colors = {Cadde:"#c45c26", Kadıköy:"#1f4b8f", "Çengelköy":"#0f7b4c"};
  const icons = {Cadde:"🏪", Kadıköy:"📍", "Çengelköy":"🌿"};
  const data = {};
  let all = {toplam:0, mesai:0, izin:0, yol:0, ceza:0, kisi:0};

  for(const b of branches){
    try{
      const snap = await db.ref("mesai/"+b).once("value");
      const d = snap.val() || {};
      let kisi=0, toplam=0, mesai=0, izin=0, yol=0;
      (d.people||[]).forEach(p=>{
        const c = calc(p);
        kisi++;
        toplam += c.toplam;
        mesai += c.mesai;
        izin += (c.izin||0)+(c.yillik||0);
        yol += c.yol;
      });
      const ceza = (d.cezalar||[]).reduce((a,c)=>a+(c.tutar||0),0);
      data[b] = {kisi, toplam, mesai, izin, yol, ceza};
      all.toplam += toplam; all.mesai += mesai; all.izin += izin; all.yol += yol; all.ceza += ceza; all.kisi += kisi;
    }catch(e){
      data[b] = {kisi:0, toplam:0, mesai:0, izin:0, yol:0, ceza:0};
    }
  }

  let prevAll = {toplam:0, mesai:0, izin:0, ceza:0};
  try{
    const prev = JSON.parse(localStorage.getItem("mesai_prev_snapshot")||"null");
    if(prev && prev.all) prevAll = prev.all;
  }catch(e){}

  function pct(cur, prev){
    if(!prev || prev===0) return "-";
    const d = ((cur-prev)/prev*100);
    const col = d>=0 ? "#0f7b4c" : "#c45c26";
    const sign = d>=0 ? "↑" : "↓";
    return `<span style="color:${col};font-weight:700;font-size:12px;">${sign} ${Math.abs(d).toFixed(1)}%</span>`;
  }

  let cards = "";
  branches.forEach(b=>{
    const t = data[b];
    const avg = t.kisi ? Math.round(t.toplam/t.kisi) : 0;
    cards += `
      <div style="background:#fff;border-radius:14px;padding:16px;border-top:5px solid ${colors[b]};box-shadow:0 1px 4px rgba(0,0,0,.06);">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-size:20px;">${icons[b]}</span><b>${b}</b>
        </div>
        <div style="font-size:12px;color:#666;">Toplam Ödenecek</div>
        <div style="font-size:24px;font-weight:800;color:${colors[b]};">${tl(t.toplam)} TL</div>
        <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:13px;"><span>👤 Kişi</span><b>${t.kisi}</b></div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:13px;"><span>📊 Ortalama</span><b>${tl(avg)} TL</b></div>
      </div>`;
  });

  function cmpRow(label, icon, cur, prevv){
    return `<div style="display:grid;grid-template-columns:1fr 1fr 80px;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #f0ebe3;font-size:13px;">
      <div style="display:flex;align-items:center;gap:6px;"><span>${icon}</span><span>${label}</span><b style="margin-left:auto;">${tl(cur)} TL</b></div>
      <div style="text-align:right;color:#555;">${prevv?tl(prevv)+" TL":"-"}</div>
      <div style="text-align:right;">${pct(cur, prevv)}</div>
    </div>`;
  }

  const max = Math.max(...branches.map(b=>data[b].toplam), 1);
  let bars = "";
  branches.forEach(b=>{
    const t = data[b];
    const w = Math.max(8, Math.round(t.toplam/max*100));
    bars += `
      <div style="margin-bottom:10px;">

function savePrevSnapshot(){
  // Will be filled by current all totals on next render

}

function savePrevSnapshot(){
  const all = {toplam:0, mesai:0, izin:0, ceza:0};
  if(state.people){
    state.people.forEach(p=>{
      const c = calc(p);
      all.toplam += c.toplam;
      all.mesai += c.mesai;
      all.izin += (c.izin||0)+(c.yillik||0);
    });
  }
  if(state.cezalar) all.ceza = state.cezalar.reduce((a,c)=>a+(c.tutar||0),0);
  localStorage.setItem("mesai_prev_snapshot", JSON.stringify({all, saved: new Date().toISOString()}));
  toast("Geçen ay kaydedildi");
  renderDashboard();
}

async function loadTurkishFont(doc){
  try{
    const res = await fetch("https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/fonts/Roboto/Roboto-Regular.ttf");
    if(!res.ok) return false;
    const buf = await res.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let bin = "";
    for(let i=0; i<bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    const b64 = btoa(bin);
    doc.addFileToVFS("Roboto-Regular.ttf", b64);
    doc.addFont("Roboto-Regular.ttf", "Roboto", "normal");
    doc.setFont("Roboto");
    return true;
  }catch(e){ return false; }
}

async function downloadPDF(kind){
  if(!kind) kind = window.ozetMode || "kisa";
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("PDF yok"); return; }
  const { jsPDF } = window.jspdf;
  const now = new Date().toLocaleString("tr-TR", {day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit"});
  let doc, font = "helvetica";

  if(kind === "kisa"){
    doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    await loadTurkishFont(doc);
    doc.setFillColor(11,18,32);
    doc.rect(0,0,210,12,"F");
    doc.setFontSize(12); doc.setTextColor(255,255,255);
    doc.text(branch + " · KISA OZET", 10, 8);
    doc.setFontSize(8);
    doc.text(now, 200, 8, {align:"right"});
    const body = (state.people||[]).map((p,i)=>[String(i+1), p.name||"", dash(calc(p).toplam)]);
    let tot = 0; (state.people||[]).forEach(p=>tot += calc(p).toplam);
    doc.autoTable({
      startY: 16,
      head: [["No","Ad Soyad","Odenecek"]],
      body: body,
      foot: [["","TOPLAM", tl(tot)]],
      theme: "grid",
      styles: {font:"Roboto", fontSize:8, cellPadding:1, halign:"center", textColor:[20,20,20]},
      headStyles: {fillColor:[31,75,143], textColor:255},
      footStyles: {fillColor:[34,34,34], textColor:255},
      columnStyles: {0:{cellWidth:15}, 1:{halign:"left", cellWidth:100}, 2:{halign:"right"}},
      margin: {left:10, right:10}
    });
  } else {
    doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
    await loadTurkishFont(doc);
    doc.setFillColor(11,18,32);
    doc.rect(0,0,297,12,"F");
    doc.setFontSize(12); doc.setTextColor(255,255,255);
    doc.text(branch + " · LISTE", 10, 8);
    doc.setFontSize(8);
    doc.text(now, 287, 8, {align:"right"});
    const body = (state.people||[]).map((p,i)=>{
      const c = calc(p);
      return [String(i+1), p.name||"", dash(c.mesai), dash(c.hs), dash(c.prim), dash(c.yol), dash(c.izin), dash(c.yillik), dash(c.toplam)];
    });
    let m=0,h=0,pr=0,y=0,iz=0,yi=0,t=0;
    (state.people||[]).forEach(p=>{const c=calc(p); m+=c.mesai;h+=c.hs;pr+=c.prim;y+=c.yol;iz+=c.izin;yi+=c.yillik;t+=c.toplam;});
    doc.autoTable({
      startY: 16,
      head: [["No","Ad Soyad","Mesai","HS","Prim","Yol","Izin","Yillik","Toplam"]],
      body: body,
      foot: [["","TOPLAM", tl(m), tl(h), tl(pr), tl(y), tl(iz), tl(yi), tl(t)]],
      theme: "grid",
      styles: {font:"Roboto", fontSize:7, cellPadding:0.8, halign:"center", textColor:[20,20,20]},
      headStyles: {fillColor:[31,75,143], textColor:255},
      footStyles: {fillColor:[34,34,34], textColor:255},
      columnStyles: {0:{cellWidth:12}, 1:{halign:"left", cellWidth:50}},
      margin: {left:8, right:8}
    });
  }
  doc.save(branch + "-" + (kind==="kisa"?"kisa-ozet":"liste") + ".pdf");
  toast("PDF indirildi");
}
