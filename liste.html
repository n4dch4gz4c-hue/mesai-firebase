<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3 Şube Mesai Listesi - Firebase</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f1ea;color:#1f2933}
.header{background:#1f4b8f;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{margin:0;font-size:20px}
button,select{padding:8px 14px;border-radius:8px;border:1px solid #d7cfc3;background:#fff;cursor:pointer;font-weight:500}
button.primary{background:#1f4b8f;color:#fff;border:none}
.tab{padding:8px 14px;border-radius:6px;cursor:pointer;background:#fff;border:1px solid #ddd}
.tab.on{background:#1f4b8f;color:#fff}
.table-wrap{overflow:auto;padding:0 16px 20px;max-height:75vh}
table{border-collapse:collapse;width:100%;min-width:1200px;background:#fff;font-size:13px}
th{background:#c45c26;color:#fff;padding:8px 4px;position:sticky;top:0}
td{border:1px solid #eadfd2;padding:4px;text-align:center}
td.name{text-align:left !important;font-weight:700;min-width:180px;padding-left:8px}
input.cell{width:60px;text-align:center;border:1px solid #ddd;border-radius:4px;padding:4px}
.stats{display:flex;gap:12px;padding:12px 16px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid #d7cfc3;border-radius:8px;padding:10px 14px}
@media (max-width:700px){
  .header{flex-direction:column;align-items:flex-start}
  .table-wrap{padding:0 8px}
  table{min-width:700px;font-size:12px}
}
</style>
</head>
<body>
<div id="loginOverlay" style="position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#fff;padding:32px;border-radius:16px;width:320px;text-align:center;">
    <h2 style="margin:0 0 8px;color:#1f4b8f;">Mesai Listesi</h2>
    <p style="margin:0 0 20px;color:#666;">Şifrenizi girin</p>
    <input id="loginPass" type="password" placeholder="Şifre" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px;box-sizing:border-box;">
    <button onclick="doLogin()" style="width:100%;padding:12px;background:#1f4b8f;color:#fff;border:none;border-radius:8px;font-weight:600;">Giriş</button>
    <div id="loginError" style="color:#c45c26;margin-top:12px;display:none;">Hatalı şifre</div>
  </div>
</div>
<div class="header">
  <div><h1>3 Şube Mesai Listesi</h1><div style="font-size:13px;opacity:.85">Firebase senkron</div></div>
  <div>
    <select id="branch" onchange="switchBranch()"><option>Cadde</option><option>Kadıköy</option><option>Çengelöy</option></select>
    <button class="primary" onclick="saveNow()">Kaydet</button>
    <span id="userName" style="font-size:13px;margin-right:8px;"></span>
    <button onclick="doLogout()" style="background:#c45c26;color:#fff;border:none;">Çıkış</button>
  </div>
</div>
<nav style="display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid #ddd;flex-wrap:wrap;">
  <button class="tab on" onclick="showTab('liste',this)">Liste</button>
  <button class="tab" onclick="showTab('devam',this)">Devamsızlık</button>
  <button class="tab" onclick="showTab('ceza',this)">Ceza</button>
  <button class="tab" onclick="showTab('dashboard',this)">Dashboard</button>
  <button class="tab" onclick="showTab('ozet',this)">Özet</button>
</nav>
<div class="stats" id="stats"></div>
<div id="sec-liste" class="table-wrap"><table><thead><tr><th>#</th><th>AD SOYAD</th><th>Mesai Saat</th><th>Mesai</th><th>HS Saat</th><th>HS</th><th>Prim Adet</th><th>Prim</th><th>Yol</th><th>İzin</th><th>Yıllık</th><th>Disiplin</th><th>TOPLAM</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="sec-devam" style="display:none;padding:16px;"></div>
<div id="sec-ceza" style="display:none;padding:16px;"></div>
<div id="sec-dashboard" style="display:none;padding:16px;"></div>
<div id="sec-ozet" style="display:none;padding:16px;"></div>
<script>
const USERS = [
  {name:"Semih Sofuoğlu", pass:"1903", branches:["Cadde","Kadıköy","Çengelöy"], admin:true},
  {name:"Alper Kızılkaya", pass:"1905", branches:["Cadde","Kadıköy","Çengelöy"], admin:true},
  {name:"Özay Alşan", pass:"367536", branches:["Kadıköy"]},
  {name:"Sedat Kızılkaya", pass:"345334", branches:["Kadıköy"]},
  {name:"Ahmet Özçelik", pass:"5353", branches:["Çengelöy"]},
  {name:"Kemal Körpe", pass:"1919", branches:["Çengelöy"]},
  {name:"İsmail", pass:"3434", branches:["Çengelöy"]},
  {name:"Ferhat Avcı", pass:"5656", branches:["Cadde"]}
];
let currentUser = null;
function doLogout(){ sessionStorage.removeItem("mesaiUser"); currentUser=null; document.getElementById("loginOverlay").style.display="flex"; document.getElementById("loginPass").value=""; }
function doLogin(){
  const p = document.getElementById("loginPass").value.trim();
  const u = USERS.find(x=>x.pass===p);
  if(!u){ document.getElementById("loginError").style.display="block"; return; }
  currentUser = u;
  sessionStorage.setItem("mesaiUser", JSON.stringify(u));
  document.getElementById("loginOverlay").style.display="none";
  applyUserAccess();
  load();
}
function applyUserAccess(){
  if(!currentUser) return;
  document.getElementById("userName").textContent = currentUser.name;
  const sel = document.getElementById("branch");
  if(sel){
    Array.from(sel.options).forEach(opt=>{
      opt.disabled = !currentUser.branches.includes(opt.value);
      opt.style.display = currentUser.branches.includes(opt.value)?"":"none";
    });
    const first = currentUser.branches[0];
    if(first){ sel.value=first; branch=first; }
  }
  const dash = document.querySelector('button.tab[onclick*="dashboard"]');
  if(dash) dash.style.display = currentUser.admin ? "" : "none";
}
(function(){
  try{
    const s = sessionStorage.getItem("mesaiUser");
    if(s){ currentUser=JSON.parse(s); document.getElementById("loginOverlay").style.display="none"; applyUserAccess(); }
  }catch(e){}
})();
const firebaseConfig = {
  apiKey: "AIzaSyBHgiy7cM5TRYz2zuwY6CeFJwrqsVCaZjk",
  authDomain: "cadde-mesai.firebaseapp.com",
  databaseURL: "https://cadde-mesai-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cadde-mesai",
  storageBucket: "cadde-mesai.firebasestorage.app",
  messagingSenderId: "622996188078",
  appId: "1:622996188078:web:22962c989bedc87c02363f"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const SEED = {"Cadde":[{"id":1,"name":"CEMAL ÇELİK","kurye":false,"mesaiSaat":0,"mesaiBirim":320,"hsSaat":0,"primAdet":0,"yolTutar":8000,"izinGun":0,"izinTutar":0,"yillikTutar":0,"disiplinDk":0}],"Kadıköy":[],"Çengelöy":[]};
const PRIM_BIRIM = 7;
let branch = "Cadde";
let state = {people:[], cezalar:[], devamsizlik:[]};
function tl(n){return Math.round(n||0).toLocaleString("tr-TR");}
function dash(n){return (Math.round(n)||0)===0?"-":tl(n);}
function calc(p){
  const mesai=(p.mesaiSaat||0)*(p.mesaiBirim||300);
  const hs=(p.hsSaat||0)*2500;
  const prim=(branch==="Cadde"&&p.kurye)?(p.primAdet||0)*PRIM_BIRIM:0;
  const yol=p.yolTutar||0;
  const izin=p.izinTutar||0;
  const yillik=p.yillikTutar||0;
  return {mesai,hs,prim,yol,izin,yillik,toplam:mesai+hs+prim+yol+izin+yillik};
}
function render(){
  const tb=document.getElementById("tbody");
  tb.innerHTML="";
  let top=0;
  (state.people||[]).forEach((p,i)=>{
    const c=calc(p); top+=c.toplam;
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${i+1}</td><td class="name">${p.name||""}</td><td><input class="cell" type="number" step="0.5" value="${p.mesaiSaat||0}" onchange="setP(${i},'mesaiSaat',this.value)"></td><td>${dash(c.mesai)}</td><td><input class="cell" type="number" step="0.5" value="${p.hsSaat||0}" onchange="setP(${i},'hsSaat',this.value)"></td><td>${dash(c.hs)}</td><td>${p.kurye?`<input class="cell" style="width:46px" type="number" value="${p.primAdet||0}" onchange="setP(${i},'primAdet',this.value)">`:'-'}</td><td>${dash(c.prim)}</td><td><input class="cell" type="number" value="${p.yolTutar||0}" onchange="setP(${i},'yolTutar',this.value)"></td><td>${dash(c.izin)}</td><td>${dash(c.yillik)}</td><td>${dash((p.disiplinDk||0))}</td><td class="formula">${dash(c.toplam)}</td>`;
    tb.appendChild(tr);
  });
  document.getElementById("stats").innerHTML = `<div class="stat"><span>Kişi</span><b>${state.people.length}</b></div><div class="stat"><span>Toplam</span><b>${tl(top)} TL</b></div>`;
}
function setP(i,k,v){ if(state.people[i]) state.people[i][k]=+v||0; render(); }
function saveNow(){ db.ref("mesai/"+branch).set(state).then(()=>toast("Kaydedildi")).catch(e=>toast(e.message)); }
function switchBranch(){ branch=document.getElementById("branch").value; load(); }
function showTab(name,el){
  ["liste","devam","ceza","dashboard","ozet"].forEach(s=>document.getElementById("sec-"+s).style.display = s===name?"block":"none");
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  el.classList.add("on");
  if(name==="devam") renderDevam();
  if(name==="ceza") renderCeza();
  if(name==="ozet") renderOzet();
  if(name==="dashboard") renderDashboard();
}
function toast(m){ const t=document.getElementById("toast")||document.createElement("div"); t.id="toast"; t.style.cssText="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:8px;z-index:99"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2000); }
function renderDevam(){ const el=document.getElementById("sec-devam"); const rows=state.devamsizlik||[]; el.innerHTML=`<h3>Devamsızlık</h3><table style="width:100%"><thead><tr><th>#</th><th>Ad</th><th>Gün</th><th>Not</th></tr></thead><tbody>${rows.map((d,i)=>`<tr><td>${i+1}</td><td class="name">${d.kisi}</td><td>${d.gun}</td><td>${d.not||"-"}</td></tr>`).join("")||"<tr><td colspan=4>Kaydı yok</td></tr>"}</tbody></table>`; }
function renderCeza(){ const el=document.getElementById("sec-ceza"); const rows=state.cezalar||[]; el.innerHTML=`<h3>Ceza</h3><table style="width:100%"><thead><tr><th>#</th><th>Ad</th><th>Tutar</th><th>Neden</th><th>Tarih</th></tr></thead><tbody>${rows.map((c,i)=>`<tr><td>${i+1}</td><td class="name">${c.kisi}</td><td>${tl(c.tutar)}</td><td>${c.neden||"-"}</td><td>${c.eklenme||"-"}</td></tr>`).join("")||"<tr><td colspan=5>Kayıt yok</td></tr>"}</tbody></table>`; }
function renderOzet(){
  const el=document.getElementById("sec-ozet");
  const mode=window.ozetMode||"kisa";
  let tot=0;
  const rows=(state.people||[]).map((p,i)=>{const c=calc(p);tot+=c.toplam;return `<tr><td>${i+1}</td><td style="text-align:left;padding-left:8px;">${p.name}</td><td style="text-align:right;font-weight:700;">${dash(c.toplam)}</td></tr>`;}).join("");
  el.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px;"><button onclick="window.ozetMode='kisa';renderOzet();" style="${mode==='kisa'?'background:#1f4b8f;color:#fff':''}">Kısa Özet</button><button onclick="window.ozetMode='detay';renderOzet();" style="${mode==='detay'?'background:#1f4b8f;color:#fff':''}">Ayrıntılı Özet</button><button onclick="downloadPDF(window.ozetMode||'kisa')">PDF</button></div><table style="max-width:480px;width:100%;"><thead><tr style="background:#1f4b8f;color:#fff;"><th>#</th><th>Ad</th><th>Toplam</th></tr></thead><tbody>${rows}</tbody><tfoot><tr style="background:#222;color:#fff;"><td></td><td>TOPLAM</td><td style="text-align:right;">${tl(tot)} TL</td></tr></tfoot></table>`;
}
async function downloadPDF(kind){
  if(!window.jspdf) return toast("PDF yok");
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:kind==="kisa"?"portrait":"landscape",unit:"mm",format:"a4"});
  const now=new Date().toLocaleString("tr-TR");
  doc.setFillColor(11,18,32); doc.rect(0,0,doc.internal.pageSize.getWidth(),12,"F");
  doc.setFontSize(12); doc.setTextColor(255); doc.text(branch+" · "+(kind==="kisa"?"KISA OZET":"LISTE"),10,8);
  doc.setFontSize(8); doc.text(now, doc.internal.pageSize.getWidth()-10,8,{align:"right"});
  if(kind==="kisa"){
    const body=(state.people||[]).map((p,i)=>[i+1,p.name||"",dash(calc(p).toplam)]);
    let tot=0; (state.people||[]).forEach(p=>tot+=calc(p).toplam);
    doc.autoTable({startY:16,head:[["No","Ad Soyad","Odenecek"]],body,foot:[["","TOPLAM",tl(tot)]],theme:"grid",styles:{fontSize:8,cellPadding:1},headStyles:{fillColor:[31,75,143]},footStyles:{fillColor:[34,34,34],textColor:255},columnStyles:{0:{cellWidth:15},1:{halign:"left",cellWidth:100},2:{halign:"right"}},margin:{left:10,right:10}});
  }else{
    const body=(state.people||[]).map((p,i)=>{const c=calc(p);return [i+1,p.name||"",dash(c.mesai),dash(c.hs),dash(c.prim),dash(c.yol),dash(c.izin),dash(c.yillik),dash(c.toplam)];});
    let m=0,h=0,pr=0,y=0,iz=0,yi=0,t=0; (state.people||[]).forEach(p=>{const c=calc(p);m+=c.mesai;h+=c.hs;pr+=c.prim;y+=c.yol;iz+=c.izin;yi+=c.yillik;t+=c.toplam;});
    doc.autoTable({startY:16,head:[["No","Ad","Mesai","HS","Prim","Yol","Izin","Yillik","Toplam"]],body,foot:[["","TOPLAM",tl(m),tl(h),tl(pr),tl(y),tl(iz),tl(yi),tl(t)]],theme:"grid",styles:{fontSize:7,cellPadding:0.8},headStyles:{fillColor:[31,75,143]},footStyles:{fillColor:[34,34,34],textColor:255},columnStyles:{0:{cellWidth:12},1:{halign:"left",cellWidth:48}},margin:{left:8,right:8}});
  }
  doc.save(branch+"-"+(kind==="kisa"?"kisa-ozet":"liste")+".pdf");
  toast("PDF indirildi");
}
async function renderDashboard(){
  const el=document.getElementById("sec-dashboard");
  el.innerHTML="<div style='padding:16px'>Yükleniyor...</div>";
  const branches=["Cadde","Kadıköy","Çengelöy"];
  const colors={Cadde:"#c45c26",Kadıköy:"#1f4b8f","Çengelöy":"#0f7b4c"};
  const data={};
  for(const b of branches){
    try{
      const snap=await db.ref("mesai/"+b).once("value");
      const d=snap.val()||{};
      let kisi=0,toplam=0;
      (d.people||[]).forEach(p=>{kisi++; toplam+=calc(p).toplam;});
      data[b]={kisi,toplam};
    }catch(e){data[b]={kisi:0,toplam:0};}
  }
  let cards="", grand=0, gk=0;
  branches.forEach(b=>{
    const t=data[b]; grand+=t.toplam; gk+=t.kisi;
    const avg=t.kisi?Math.round(t.toplam/t.kisi):0;
    cards+=`<div style="background:#fff;border-radius:14px;padding:16px;border-top:5px solid ${colors[b]};"><b>${b}</b><div style="font-size:24px;font-weight:800;color:${colors[b]};">${tl(t.toplam)} TL</div><div style="font-size:13px;margin-top:8px;">👤 ${t.kisi} kişi • Ortalama ${tl(avg)} TL</div></div>`;
  });
  el.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">${cards}</div><div style="background:#fff;border-radius:14px;padding:16px;margin-top:12px;"><b>Genel Toplam</b><div style="font-size:28px;font-weight:800;color:#1f4b8f;">${tl(grand)} TL</div><div style="font-size:13px;color:#666;">${gk} kişi</div></div>`;
}
function load(){
  if(SEED[branch] && SEED[branch].length && (!state.people||!state.people.length)){
    state={people:SEED[branch],cezalar:[],devamsizlik:[]};
    render();
  }
  db.ref("mesai/"+branch).once("value").then(snap=>{
    const d=snap.val();
    if(d && d.people && d.people.length){
      state=d;
      if(!state.cezalar) state.cezalar=[];
      if(!state.devamsizlik) state.devamsizlik=[];
      render();
    }
  }).catch(()=>{});
  db.ref("mesai/"+branch).on("value",snap=>{
    const d=snap.val();
    if(d && d.people){ state=d; if(!state.cezalar)state.cezalar=[]; if(!state.devamsizlik)state.devamsizlik=[]; render(); }
  });
}
load();
</script>
<div id="toast"></div>
</body>
</html>
